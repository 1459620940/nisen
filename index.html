<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>720全景漫游 | 无人机作品集</title>
    <!-- 引入样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.7.1/index.min.css">
    <style>
        *{margin:0;padding:0}
        #viewer{width:100vw;height:100vh;}
        /* 自定义热点弹窗样式 */
        .custom-hotspot{
            padding:8px 12px;
            background:#000000cc;
            color:#fff;
            border-radius:6px;
            max-width:220px;
        }
    </style>
</head>
<body>
<div id="viewer"></div>

<!-- 引入JS -->
<script src="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.7.1/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5.7.1/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/navigation-plugin@5.7.1/index.min.js"></script>

<script>
const { Viewer } = PhotoSphereViewer;
const { MarkersPlugin } = PhotoSphereViewerMarkers;
const { NavigationPlugin } = PhotoSphereViewerNavigation;

// ==========【配置所有全景场景】在这里新增/删除场景 ==========
const SCENES = {
    // 场景1
    scene1: {
        panorama: "scene1.jpg", // 第一张全景图（2:1等矩形全景）
        name: "场地A航拍全景",
        initialPitch: 0,   // 初始垂直角度
        initialYaw: 0,     // 初始水平角度
        initialZoom: 60,
        markers: [
            // 普通文字热点
            {
                id: "mark1",
                position: { yaw: 0.2, pitch: 0.1 },
                html: `<div class="custom-hotspot">一号建筑｜无人机测绘项目</div>`
            },
            // 跳转场景箭头热点：点击去往scene2
            {
                id: "to_scene2",
                position: { yaw: 1.5, pitch: 0 },
                html: `<div style="background:#2563eb;padding:6px;border-radius:50%;color:white;">➡前往场地B</div>`,
                // 点击切换场景
                onClick: ()=>{
                    loadScene("scene2");
                }
            }
        ]
    },
    // 场景2
    scene2: {
        panorama: "scene2.jpg",
        name: "场地B航拍全景",
        initialPitch: 0,
        initialYaw: Math.PI,
        initialZoom: 60,
        markers: [
            {
                id: "mark2",
                position: { yaw: -1, pitch: 0.2 },
                html: `<div class="custom-hotspot">二期工程航拍点位</div>`
            },
            // 返回场景1
            {
                id: "to_scene1",
                position: { yaw: -2, pitch: 0 },
                html: `<div style="background:#2563eb;padding:6px;border-radius:50%;color:white;">⬅返回场地A</div>`,
                onClick: ()=>{
                    loadScene("scene1");
                }
            }
        ]
    }
};

// 创建全景播放器实例
const viewer = new Viewer({
    container: document.getElementById('viewer'),
    plugins: [
        MarkersPlugin,
        NavigationPlugin
    ]
});
const markersPlugin = viewer.getPlugin(MarkersPlugin);

// 加载场景通用函数【核心】
async function loadScene(sceneId){
    const scene = SCENES[sceneId];
    await viewer.setPanorama(scene.panorama, {
        pitch: scene.initialPitch,
        yaw: scene.initialYaw,
        zoom: scene.initialZoom
    });
    // 清空旧热点，加载当前场景热点
    markersPlugin.clearMarkers();
    markersPlugin.addMarkers(scene.markers);
}

// 默认打开第一个场景
loadScene("scene1");
</script>
</body>
</html>
